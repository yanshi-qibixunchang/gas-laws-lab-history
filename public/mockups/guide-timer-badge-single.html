<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>引导模式等待计时器单款预览</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      color: #0f172a;
      background: #dceaf4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.92), rgba(224, 239, 249, 0.82) 34%, rgba(199, 217, 229, 0.86) 100%),
        #dceaf4;
    }

    .stage {
      position: relative;
      width: min(1040px, 96vw);
      height: min(560px, 70vh);
      min-height: 420px;
      overflow: hidden;
      border: 1px solid rgba(148, 163, 184, 0.32);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(240, 249, 255, 0.88), rgba(235, 245, 252, 0.9)),
        #eef7fc;
      box-shadow: 0 24px 60px rgba(71, 85, 105, 0.18);
    }

    .bench {
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 150px;
      transform: skewX(-9deg);
      transform-origin: left bottom;
      background: #b4c1c5;
      box-shadow: inset 0 12px 0 rgba(255, 255, 255, 0.2);
    }

    .bottle {
      position: absolute;
      left: 382px;
      top: 165px;
      width: 128px;
      height: 286px;
      border: 4px solid rgba(94, 110, 122, 0.22);
      border-radius: 36px 36px 42px 42px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.5), rgba(173, 194, 204, 0.2));
      box-shadow:
        inset 12px 0 28px rgba(255, 255, 255, 0.38),
        inset -10px 0 22px rgba(94, 110, 122, 0.12);
    }

    .particle {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #b05b76;
      opacity: 0.85;
      box-shadow: 0 0 0 1px rgba(127, 29, 69, 0.06);
    }

    .p1 { left: 442px; top: 228px; }
    .p2 { left: 482px; top: 286px; }
    .p3 { left: 456px; top: 340px; }
    .p4 { left: 424px; top: 394px; }
    .p5 { left: 496px; top: 384px; }

    .timer-badge {
      position: absolute;
      left: 250px;
      top: 72px;
      width: 560px;
      height: 174px;
    }

    .timer-badge svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 18px 28px rgba(71, 85, 105, 0.16));
    }

    .main-shell,
    .timer-shell {
      fill: url("#shellGradient");
      stroke: rgba(148, 163, 184, 0.74);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .timer-shell {
      stroke: rgba(148, 163, 184, 0.68);
    }

    .shell-highlight {
      fill: none;
      stroke: rgba(255, 255, 255, 0.72);
      stroke-width: 1.2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .speed-label {
      position: absolute;
      left: 52px;
      top: 38px;
      display: grid;
      gap: 1px;
      color: #64748b;
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
    }

    .speed-label strong {
      color: #334155;
      font-size: 21px;
      font-weight: 900;
      line-height: 1;
    }

    .speed-options {
      position: absolute;
      left: 184px;
      top: 28px;
      display: grid;
      grid-template-columns: repeat(4, 54px);
      align-items: center;
      height: 58px;
      padding: 4px;
      border: 1px solid rgba(148, 163, 184, 0.42);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(248, 250, 252, 0.98), rgba(237, 246, 251, 0.96));
      box-shadow:
        inset 0 2px 5px rgba(71, 85, 105, 0.12),
        0 1px 0 rgba(255, 255, 255, 0.62);
    }

    .speed-options span {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      color: #64748b;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
    }

    .speed-options .active {
      color: white;
      background: linear-gradient(180deg, #38bdf8, #0284c7);
      box-shadow:
        0 8px 18px rgba(14, 165, 233, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    .timer-content {
      position: absolute;
      left: 178px;
      top: 107px;
      display: grid;
      grid-template-columns: 26px auto;
      column-gap: 12px;
      align-items: center;
      font-family: Consolas, "JetBrains Mono", monospace;
    }

    .progress-dot {
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #f8fafc 0 35%, transparent 38%),
        conic-gradient(#0ea5e9 0 84%, rgba(14, 165, 233, 0.16) 84% 100%);
      box-shadow: 0 0 0 7px rgba(14, 165, 233, 0.1);
    }

    .time {
      color: #0f172a;
      font-size: 25px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: 0;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="引导模式等待计时器单款预览">
    <div class="bench"></div>
    <div class="bottle"></div>
    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>
    <span class="particle p5"></span>

    <section class="timer-badge" aria-label="等待倍速与计时器">
      <svg viewBox="0 0 560 174" aria-hidden="true">
        <defs>
          <linearGradient id="shellGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f9fcfe" />
            <stop offset="0.48" stop-color="#eef7fc" />
            <stop offset="1" stop-color="#e1f3fd" />
          </linearGradient>
        </defs>

        <!-- Timer cabin is painted first so the main capsule keeps a clean outline. -->
        <path
          class="timer-shell"
          d="M 122 98
             L 154 142
             H 340
             C 376 142 406 116 420 86
             C 414 94 404 98 392 98
             Z"
        />

        <!-- Main capsule: compact standalone pill matching the old lower style. -->
        <rect class="main-shell" x="28" y="18" width="404" height="80" rx="40" ry="40" />

        <path class="shell-highlight" d="M 52 24 H 390 A 32 32 0 0 1 422 56" />
        <path class="shell-highlight" d="M 160 132 H 336 C 371 132 397 112 414 94" />
      </svg>

      <div class="speed-label">
        <span>WAIT RATE</span>
        <strong>等待倍速</strong>
      </div>
      <div class="speed-options" aria-label="倍速选项">
        <span>×2</span>
        <span>×4</span>
        <span>×8</span>
        <span class="active">×16</span>
      </div>

      <div class="timer-content" aria-label="等待计时">
        <span class="progress-dot"></span>
        <strong class="time">04:21/05:00</strong>
      </div>
    </section>
  </main>
</body>
</html>
